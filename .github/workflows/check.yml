# CI del proyecto (ADR 0020).
# - check: lint + tests en cada push a main y en cada PR. Sin red ni secretos (los tests usan fixtures).
# - smoke: casos de aceptacion EN VIVO contra las fuentes reales, una vez al dia o a mano.
#   Si falla, abre (o comenta) un issue: indica que una fuente cambio.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Chile (horario de verano)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --version
      - run: npm run check

  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Smoke en vivo
        shell: bash # activa pipefail: sin esto, el tee ocultaria la falla
        run: npm run smoke 2>&1 | tee smoke.log
        env:
          BCI_SUBSCRIPTION_KEY: ${{ secrets.BCI_SUBSCRIPTION_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - name: Reportar la falla en un issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BCI_SUBSCRIPTION_KEY: ${{ secrets.BCI_SUBSCRIPTION_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          title="Smoke en vivo fallando"
          log="$(cat smoke.log 2>/dev/null || echo 'sin salida')"
          # GitHub enmascara los secretos en los logs, pero no en el texto de un issue.
          [ -n "$BCI_SUBSCRIPTION_KEY" ] && log="${log//"$BCI_SUBSCRIPTION_KEY"/***}"
          [ -n "$JINA_API_KEY" ] && log="${log//"$JINA_API_KEY"/***}"
          body="$(printf 'Corrida: %s\n\n```\n%s\n```\n' "$RUN_URL" "$log")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
